<section id="portfolio">
  <div class="container">
    <h2 class="text-center mb-4">Proiecte în timp</h2>
    <canvas id="timelineChart"></canvas>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- adapter required for time scale to work -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<script>
  // build dataset from projects data
  const points = [{% for p in site.data.projects %}{% if p.area_num and p.year %}{ x: new Date({{ p.year }},0,1), y: {{ p.area_num }}, name: "{{ p.name | escape }}" }{% unless forloop.last %},{% endunless %}{% endif %}{% endfor %}];

  // compute aggregates by year: total area and project count
  const totals = {};
  const counts = {};
  points.forEach(p => {
    const year = p.x.getFullYear();
    totals[year] = (totals[year]||0) + p.y;
    counts[year] = (counts[year]||0) + 1;
  });
  const barPoints = Object.entries(totals).map(([yr,sum]) => ({ x: new Date(yr,0,1), y: sum }));
  const countPoints = Object.entries(counts).map(([yr,c]) => ({ x: new Date(yr,0,1), y: c }));

  const ctx = document.getElementById('timelineChart').getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      datasets: [
        {
          label: 'Total area per year (ha)',
          data: barPoints,
          backgroundColor: 'rgba(54,162,235,0.7)',
          borderColor: 'rgba(54,162,235,1)',
          borderWidth: 1,
          yAxisID: 'y'
        },
        {
          label: 'Number of projects',
          type: 'line',
          data: countPoints,
          borderColor: 'rgba(255,99,132,1)',
          backgroundColor: 'rgba(255,99,132,0.2)',
          fill: false,
          yAxisID: 'yCount'
        }
      ]
    },
    options: {
      responsive: true,
      scales: {
        x: {
          type: 'time',
          time: { unit: 'year' },
          title: { display: true, text: 'Year' }
        },
        y: {
          title: { display: true, text: 'Area (ha)' }
        },
        yCount: {
          position: 'right',
          title: { display: true, text: 'Projects' },
          grid: { drawOnChartArea: false }
        }
      },
      plugins: {
        legend: { display: true }
      }
    }
  });
</script>
