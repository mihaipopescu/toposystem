<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="author" content="TopoSystem">
    <meta name="theme-color" content="#102b36">
    <link rel="icon" href="{{ '/img/favicon.svg' | relative_url }}" type="image/svg+xml">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts - HTTPS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700;900&family=Open+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ '/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" type="text/css">

    {% seo %}

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "TopoSystem Craiova",
      "url": {{ site.url | jsonify }},
      "logo": {{ '/img/toposystem-mark.svg' | absolute_url | jsonify }},
      "email": {{ site.email | jsonify }},
      "telephone": "+4{{ site.mobile }}",
      "description": {{ site.description | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Str. Mihail Kogălniceanu, nr. 19, bl. 97, sc. E, ap. 12",
        "addressLocality": "Craiova",
        "addressRegion": "Dolj",
        "addressCountry": "RO"
      },
      "areaServed": [
        { "@type": "AdministrativeArea", "name": "Dolj" },
        { "@type": "AdministrativeArea", "name": "Vâlcea" }
      ],
      "knowsAbout": [
        "cadastru și intabulare",
        "ridicări și trasări topografice",
        "documentații cadastrale",
        "proiectare edilitară"
      ]
    }
    </script>

</head>
